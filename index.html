<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聲音辨識測驗</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 20px auto; padding: 20px; background-color: #f9f9f9; color: #333; }
        .survey-container { background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .question-block { border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 25px; border-radius: 8px; background-color: #fafafa; }
        .question-title { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; color: #2c3e50; }
        .play-btn { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; margin-bottom: 15px; display: inline-flex; align-items: center; }
        .play-btn:hover { background-color: #2980b9; }
        .options-group label { display: block; margin-bottom: 10px; cursor: pointer; padding: 5px; border-radius: 4px; transition: background-color 0.2s; }
        .options-group label:hover { background-color: #eef2f5; }
        .submit-btn { width: 100%; background-color: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .submit-btn:hover { background-color: #219653; }
        select, input[type="radio"] { margin-right: 10px; cursor: pointer; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 1em; }
    </style>
</head>
<body>

<div class="survey-container">
    <h1>聲音辨識測驗</h1>
    <form id="audioSurvey" onsubmit="submitForm(event)">
        
        <!-- 第1題：班別 -->
        <div class="question-block">
            <div class="question-title">1. 班別</div>
            <select name="q1" required>
                <option value="" disabled selected>請選擇您的班別</option>
                <!-- 使用 JavaScript 動態生成 1-16 的選項，保持程式碼簡潔 -->
                <script>
                    for(let i=1; i<=16; i++){
                        document.write(`<option value="${i}">第 ${i} 班</option>`);
                    }
                </script>
            </select>
        </div>

        <!-- 第2題：是否通過8800認證 -->
        <div class="question-block">
            <div class="question-title">2. 是否通過 8800 認證？</div>
            <div class="options-group">
                <label><input type="radio" name="q2" value="已通過" required> 已通過</label>
                <label><input type="radio" name="q2" value="尚未通過"> 尚未通過</label>
            </div>
        </div>

        <!-- 第3題：ㄝ -->
        <div class="question-block">
            <div class="question-title">3. 哪一個聲音是「ㄝ」？</div>
            <audio id="audio3" src="audio/e.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio3').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q3" value="1" required> 1</label>
                <label><input type="radio" name="q3" value="2"> 2</label>
                <label><input type="radio" name="q3" value="3"> 3</label>
                <label><input type="radio" name="q3" value="4"> 4</label>
                <label><input type="radio" name="q3" value="5"> 5</label>
            </div>
        </div>

        <!-- 第4題：ㄚ -->
        <div class="question-block">
            <div class="question-title">4. 哪一個聲音是「ㄚ」？</div>
            <audio id="audio4" src="audio/a.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio4').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q4" value="1" required> 1</label>
                <label><input type="radio" name="q4" value="2"> 2</label>
                <label><input type="radio" name="q4" value="3"> 3</label>
                <label><input type="radio" name="q4" value="4"> 4</label>
                <label><input type="radio" name="q4" value="5"> 5</label>
            </div>
        </div>

        <!-- 第5題：ㄠ -->
        <div class="question-block">
            <div class="question-title">5. 哪一個聲音是「ㄠ」？</div>
            <audio id="audio5" src="audio/ao.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio5').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q5" value="1" required> 1</label>
                <label><input type="radio" name="q5" value="2"> 2</label>
                <label><input type="radio" name="q5" value="3"> 3</label>
                <label><input type="radio" name="q5" value="4"> 4</label>
                <label><input type="radio" name="q5" value="5"> 5</label>
            </div>
        </div>

        <!-- 第6題：一 -->
        <div class="question-block">
            <div class="question-title">6. 哪一個聲音是「一」？</div>
            <audio id="audio6" src="audio/i.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio6').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q6" value="1" required> 1</label>
                <label><input type="radio" name="q6" value="2"> 2</label>
                <label><input type="radio" name="q6" value="3"> 3</label>
                <label><input type="radio" name="q6" value="4"> 4</label>
                <label><input type="radio" name="q6" value="5"> 5</label>
            </div>
        </div>

        <!-- 第7題：ㄨ -->
        <div class="question-block">
            <div class="question-title">7. 哪一個聲音是「ㄨ」？</div>
            <audio id="audio7" src="audio/u.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio7').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q7" value="1" required> 1</label>
                <label><input type="radio" name="q7" value="2"> 2</label>
                <label><input type="radio" name="q7" value="3"> 3</label>
                <label><input type="radio" name="q7" value="4"> 4</label>
                <label><input type="radio" name="q7" value="5"> 5</label>
            </div>
        </div>

        <!-- 第8題：ㄛ -->
        <div class="question-block">
            <div class="question-title">8. 哪一個聲音是「ㄛ」？</div>
            <audio id="audio8" src="audio/o.mp3"></audio>
            <button type="button" class="play-btn" onclick="document.getElementById('audio8').play()">▶ 播放音檔</button>
            <div class="options-group">
                <label><input type="radio" name="q8" value="1" required> 1</label>
                <label><input type="radio" name="q8" value="2"> 2</label>
                <label><input type="radio" name="q8" value="3"> 3</label>
                <label><input type="radio" name="q8" value="4"> 4</label>
                <label><input type="radio" name="q8" value="5"> 5</label>
            </div>
        </div>

        <button type="submit" class="submit-btn">送出問卷</button>
    </form>
</div>

<script>
    function submitForm(event) {
        event.preventDefault();
        
        // 將送出按鈕改為處理中，防止重複點擊
        const submitBtn = document.querySelector('.submit-btn');
        const originalText = submitBtn.innerText;
        submitBtn.innerText = '資料傳送中...';
        submitBtn.disabled = true;

        const form = document.getElementById('audioSurvey');
        const formData = new FormData(form);
        
        // 【注意】請將下方引號內的網址替換為您的 Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzc3HI06UKA2n4MlgGtJxqqJSK4jcNnbV76uXLKupwZKPmdJNFHiBVc2MITP7O_lgXF/exec'; 

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => {
                alert('感謝您的填寫！資料已成功送出。');
                form.reset();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('發生錯誤，請稍後再試。');
            })
            .finally(() => {
                // 恢復按鈕狀態
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            });
    }
</script>

</body>
</html>
